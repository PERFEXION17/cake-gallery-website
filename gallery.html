<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="main.css" />
    <title>Cakes Haven | Gallery</title>
  </head>
  <body>
    <header>
      <nav>
        <div class="logo"><a href="index.html">Cakes Haven</a></div>
        <div class="nav_links">
          <a href="#" class="btn">Contact Us</a>
        </div>
      </nav>
    </header>

    <main>
      <section id="gallery"></section>
    </main>

    <footer>
      <p>
        &copy; 2026 All Rights Reserved | Cakes Haven |
        <a
          href="https://wa.me/2348100334346?text=Hello,%20Mr.%20Achusim%20Chibuike%20Joseph"
          target="_blank"
          >PERFEXION INC.</a
        >
      </p>
    </footer>

    <script type="module" src="/assets/js/data.js"></script>
    <script type="module">
      import { allProducts } from "/assets/js/data.js";

      const gallery = document.getElementById("gallery");
      const params = new URLSearchParams(window.location.search);
      const currentSlug = params.get("slug");

      // 1. Find the main category object
      const categoryData = allProducts.find((p) => p.slug === currentSlug);

      if (categoryData) {
        // 2. Map through the products inside this category
        const itemsHTML = categoryData.items
          .map(
            (item, index) => `
            <div class="gallery_card ${index === 0 || index === 3 ? "span-2" : ""}" 
                onclick="openSliderModal('${item.id}')">
                <img src="${item.mainImage}" alt="${item.name}" />
                <div class="cake-info">
                    <h3>${item.name}</h3>
                    <p style='text-decoration: underline;'>View Gallery</p>
                </div>
            </div>
        `,
          )
          .join("");

        gallery.innerHTML = `
          <h2>${categoryData.title}</h2>
          <div class='gallery_con'>
              ${itemsHTML}
          </div>
          <div class='btn_con'><a href='index.html' class='btn'>Back to Home</a></div>
          `;

        // 3. The Modal Controller Logic
        window.openSliderModal = (itemId) => {
          // Find the specific product clicked
          const item = categoryData.items.find((i) => i.id === itemId);
          const modal = document.getElementById("sliderModal");
          const container = document.getElementById("slidesContainer");
          const dots = document.getElementById("dotIndicator");

          // Merge main image and sub-gallery into one array
          const allImages = [item.mainImage, ...item.gallery];

          // Inject Slides
          container.innerHTML = allImages
            .map(
              (url) => `
                <img src="${url}" alt="${item.name}">
              `,
            )
            .join("");

          // Inject Dots
          dots.innerHTML = allImages
            .map(
              (_, i) => `
                <div class="dot ${i === 0 ? "active" : ""}"></div>
              `,
            )
            .join("");

          document.getElementById("modalCaption").innerHTML = `
          <h3>${item.name}</h3>
          <p>${item.description}</p>
            `;
          modal.style.display = "flex";
          document.body.style.overflow = "hidden"; // Prevent background scroll

          // Logic for indicator dots
          container.onscroll = () => {
            const index = Math.round(
              container.scrollLeft / container.offsetWidth,
            );
            document.querySelectorAll(".dot").forEach((dot, i) => {
              dot.classList.toggle("active", i === index);
            });
          };
        };

        window.closeModal = () => {
          document.getElementById("sliderModal").style.display = "none";
          document.body.style.overflow = "auto";
        };
      } else {
        gallery.innerHTML = `
        <div class='empty_con'>
            <h2>Category Not Found</h2>
            <a href='index.html' class='btn'>Back to Home</a>
        </div>
    `;
      }
    </script>

    <div id="sliderModal" class="modal">
      <div class="modal-content">
        <span class="modal-close" onclick="closeModal()">&times;</span>
        <div id="slidesContainer" class="slides-container"></div>
        <h3 id="modalCaption" style="text-align: center; margin-top: var(--spacing-xs)"></h3>
        <div id="dotIndicator" class="dot-indicator"></div>
      </div>
    </div>
  </body>
</html>
